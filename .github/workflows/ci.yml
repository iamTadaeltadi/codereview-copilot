name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/api/requirements.txt
            services/graph/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django backend tests
        env:
          DJANGO_SETTINGS_MODULE: django_backend.test_settings
          PYTHONPATH: services/api:services/agents:services/graph
        run: python services/api/manage.py test core.tests -v 2

      - name: Python integration tests
        env:
          DJANGO_SETTINGS_MODULE: django_backend.test_settings
          PYTHONPATH: services/api:services/agents:services/graph
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Backend coverage threshold
        env:
          DJANGO_SETTINGS_MODULE: django_backend.test_settings
          PYTHONPATH: services/api:services/agents:services/graph
        run: |
          pip install coverage
          coverage run services/api/manage.py test core.tests
          coverage report

  web:
    name: Web client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
